services:
  # ===========================================
  # Frontend (React + Vite)
  # ===========================================
  frontend:
    build:
      context: ./repos/anvy_frontend
      dockerfile: ../../dockerfiles/Dockerfile.frontend
    container_name: anvy-frontend
    restart: unless-stopped
    networks:
      - anvy-network

  # ===========================================
  # Backend (Node.js API)
  # ===========================================
  backend:
    build:
      context: ./repos/anvy_backend
      dockerfile: ../../dockerfiles/Dockerfile.backend
    container_name: anvy-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-anvy_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - CRON_SECRET=${CRON_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - FOLLOW_UP_REMINDER_TIMEZONE=${FOLLOW_UP_REMINDER_TIMEZONE:-Asia/Ho_Chi_Minh}
      - FOLLOW_UP_REMINDER_RESEND_HOURS=${FOLLOW_UP_REMINDER_RESEND_HOURS:-1}
    networks:
      - anvy-network
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  # ===========================================
  # Jenkins Scheduler
  # ===========================================
  jenkins:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.jenkins
    container_name: anvy-jenkins
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - BACKEND_INTERNAL_URL=http://backend:5000
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - jenkins_home:/var/jenkins_home
    ports:
      - "8081:8080"
      - "50000:50000"
    networks:
      - anvy-network
    depends_on:
      - backend

  # ===========================================
  # PostgreSQL 16
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: anvy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-anvy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"  # Internal only — NOT accessible from internet
    networks:
      - anvy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anvy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # Elasticsearch
  # ===========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: anvy-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - anvy-network

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: anvy-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/www:/var/www/certbot
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - anvy-network
    depends_on:
      - frontend
      - backend

# ===========================================
# Networks
# ===========================================
networks:
  anvy-network:
    driver: bridge
    name: anvy-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
    name: anvy-postgres-data
  elasticsearch_data:
    driver: local
    name: anvy-elasticsearch-data
  jenkins_home:
    driver: local
    name: anvy-jenkins-home
