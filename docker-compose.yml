services:
  # ===========================================
  # Frontend (React + Vite)
  # ===========================================
  frontend:
    build:
      context: ./repos/anvy_frontend
      dockerfile: ../../dockerfiles/Dockerfile.frontend
    container_name: anvy-frontend
    restart: unless-stopped
    networks:
      - anvy-network

  # ===========================================
  # Backend (Node.js API)
  # ===========================================
  backend:
    build:
      context: ./repos/anvy_backend
      dockerfile: ../../dockerfiles/Dockerfile.backend
    container_name: anvy-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-anvy_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    networks:
      - anvy-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================
  # PostgreSQL 16
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: anvy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-anvy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"  # Internal only — NOT accessible from internet
    networks:
      - anvy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anvy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: anvy-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - anvy-network
    depends_on:
      - frontend
      - backend

# ===========================================
# Networks
# ===========================================
networks:
  anvy-network:
    driver: bridge
    name: anvy-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
    name: anvy-postgres-data
