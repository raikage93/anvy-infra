services:
  frontend:
    image: node:20-alpine
    container_name: anvy-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./repos/anvy_frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - anvy-network

  backend:
    image: node:20-alpine
    container_name: anvy-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --legacy-watch"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-anvy_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    volumes:
      - ./repos/anvy_backend:/app
      - backend_node_modules:/app/node_modules
    expose:
      - "5000"
    networks:
      - anvy-network
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: anvy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-anvy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - anvy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-anvy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: anvy-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    networks:
      - anvy-network

  nginx:
    image: nginx:alpine
    container_name: anvy-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "8080:80"
    networks:
      - anvy-network
    depends_on:
      - frontend
      - backend

networks:
  anvy-network:
    driver: bridge
    name: anvy-network

volumes:
  postgres_data:
    driver: local
    name: anvy-postgres-data
  frontend_node_modules:
    driver: local
    name: anvy-frontend-node-modules
  backend_node_modules:
    driver: local
    name: anvy-backend-node-modules
  elasticsearch_data:
    driver: local
    name: anvy-elasticsearch-data
